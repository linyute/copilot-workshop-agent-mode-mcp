<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待辦清單</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <header class="title-row">
      <h1 class="title">待辦清單</h1>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切換深色模式"></button>
    </header>

    <!-- 新增待辦的表單:使用 form 可支援按 Enter 送出 -->
    <form id="todo-form" class="input-row" autocomplete="off">
      <input
        id="todo-input"
        class="input"
        type="text"
        placeholder="輸入待辦事項…"
        maxlength="100"
        aria-label="待辦事項內容">
      <button type="submit" class="btn-add">新增</button>
    </form>

    <!-- 篩選目前要顯示的待辦項目 -->
    <div class="filter-row" role="group" aria-label="待辦篩選">
      <button class="filter-btn active" type="button" data-filter="all" aria-pressed="true">全部</button>
      <button class="filter-btn" type="button" data-filter="active" aria-pressed="false">未完成</button>
      <button class="filter-btn" type="button" data-filter="completed" aria-pressed="false">已完成</button>
    </div>

    <!-- 待辦清單容器 -->
    <ul id="todo-list" class="todo-list"></ul>

    <!-- 清單為空時顯示的提示 -->
    <p id="empty-hint" class="empty-hint" hidden></p>

    <footer class="footer">
      <span id="remaining">未完成:0 項</span>
      <button id="clear-completed" class="btn-clear" type="button" aria-label="清除所有已完成項目" hidden>
        清除已完成
      </button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
