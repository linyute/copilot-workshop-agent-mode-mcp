<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待辦清單</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <h1 class="title">待辦清單</h1>

    <!-- 新增待辦的表單:使用 form 可支援按 Enter 送出 -->
    <form id="todo-form" class="input-row" autocomplete="off">
      <input
        id="todo-input"
        class="input"
        type="text"
        placeholder="輸入待辦事項…"
        maxlength="100"
        aria-label="待辦事項內容">
      <button type="submit" class="btn-add">新增</button>
    </form>

    <!-- 待辦清單容器 -->
    <ul id="todo-list" class="todo-list"></ul>

    <!-- 清單為空時顯示的提示 -->
    <p id="empty-hint" class="empty-hint" hidden>還沒有任何待辦事項,新增一個吧!</p>

    <footer class="footer">
      <span id="remaining">未完成:0 項</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
